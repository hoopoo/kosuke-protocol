name = "parallel-life-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "ParallelLifeBackend"
image = "../../kosuke-backend/Dockerfile"
max_instances = 5
# linux/amd64 required on Cloudflare Containers
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "BACKEND"
class_name = "ParallelLifeBackend"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ParallelLifeBackend"]

[env.staging]
name = "parallel-life-api-staging"
vars = { ENV = "staging", ENVIRONMENT = "staging", DEEP_READING_ENABLED = "true", DEEP_READING_CONTEXT_PACK_ENABLED = "true", SESSION_STORE_BACKEND = "do", CORS_ALLOW_ORIGINS = "https://parallel-life-staging.pages.dev,https://978a9f4c.parallel-life-staging.pages.dev" }

[[env.staging.containers]]
class_name = "ParallelLifeBackend"
image = "../../kosuke-backend/Dockerfile"
max_instances = 5
instance_type = "standard-1"

[[env.staging.durable_objects.bindings]]
name = "BACKEND"
class_name = "ParallelLifeBackend"

[env.production]
name = "parallel-life-api"
# Context Pack stays OFF in production — v1.0.2 Strict path only.
vars = { ENV = "production", ENVIRONMENT = "production", DEEP_READING_ENABLED = "true", DEEP_READING_CONTEXT_PACK_ENABLED = "false", SESSION_STORE_BACKEND = "do", CORS_ALLOW_ORIGINS = "https://parallel-life.pages.dev,https://a8ac5a22.parallel-life.pages.dev,https://parallel-life.shiroand.io" }

[[env.production.containers]]
class_name = "ParallelLifeBackend"
image = "../../kosuke-backend/Dockerfile"
max_instances = 10
instance_type = "standard-1"

[[env.production.durable_objects.bindings]]
name = "BACKEND"
class_name = "ParallelLifeBackend"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ParallelLifeBackend"]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ParallelLifeBackend"]

# Secrets (set via wrangler; never commit):
#   npx wrangler secret put OPENAI_API_KEY --env staging|production
#   npx wrangler secret put SESSION_STORE_URL --env staging|production
#   npx wrangler secret put SESSION_STORE_TOKEN --env staging|production
# Production SESSION_STORE_* must point at parallel-life-session-do (NOT staging).
